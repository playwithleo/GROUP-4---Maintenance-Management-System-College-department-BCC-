<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | BCC Maintenance System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-header">
      <img class="login-logo" src="assets/BCC.png" alt="Binangonan Catholic College logo">
      <h1>Binangonan Catholic College</h1>
      <p>College Department Maintenance System</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@bcc.edu.ph" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <p id="errorMsg" class="error-text"></p>

      <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <div class="demo-accounts">
      <div class="demo-row">
        <span>Admin: <code>admin@bcc.edu.ph</code> / <code>bcc1947</code></span>
        <button type="button" class="btn-fill" data-demo-user="admin">Use</button>
      </div>
      <div class="demo-row">
        <span>Staff: <code>staff@bcc.edu.ph</code> / <code>group3</code></span>
        <button type="button" class="btn-fill" data-demo-user="staff">Use</button>
      </div>
    </div>

    <div class="login-footer">
      Group 3 • Pro Deo Et Patria
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
